[project]
name = "synapsecord-profiler"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.19.1",
    "synapsecord-core",
]

[project.scripts]
synapsecord-profiler = "synapsecord_profiler.main:main"

[tool.uv.sources]
synapsecord-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synapsecord_profiler"
module-root = "src"