[project]
name = "synapsecord-core"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synapsecord_core"
module-root = "src"