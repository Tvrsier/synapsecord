[project]
name = "synapsecord"
version = "0.1.0"
description = "Discord-based player profiling and intelligent team matchmaking platform for competitive games."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "asyncio>=4.0.0",
    "coverage>=7.16.2",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/bot",
    "apps/profiler",
    "packages/core",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select=[
    "E",
    "F",
    "I",
    "UP",
    "B"
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[build-system]
requires = ["uv_build>=0.12.19, <0.13"]
build-backend = "uv_build"
